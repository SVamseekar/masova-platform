name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 0: Static integration matrix (no services required)
  # ============================================================
  integration-matrix:
    name: Integration Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify API wiring (stale paths, dead RTK, gateway gaps)
        run: node .github/ci/integration-matrix-audit.js --ci

  # ============================================================
  # Job 1: Backend tests (all 6 services)
  # ============================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: masova
          RABBITMQ_DEFAULT_PASS: masova_secret
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests (6 services)
        env:
          JWT_SECRET: ci-test-secret-key-at-least-64-chars-long-for-hs512-algorithm-security
          RABBITMQ_USERNAME: masova
          RABBITMQ_PASSWORD: masova_secret
          MONGODB_URI: mongodb://localhost:27017/masova_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          mvn test \
            -pl api-gateway,core-service,commerce-service,payment-service,logistics-service,intelligence-service \
            -am \
            --no-transfer-progress

  # ============================================================
  # Job 1b: Backend integration tests (Failsafe, *IT.java, all 6 services)
  # Testcontainers spins up its own Mongo/Postgres/Redis/RabbitMQ per
  # BaseIntegrationTest/BaseFullIntegrationTest — no services: block needed,
  # just a Docker daemon (ubuntu-latest ships one by default).
  # ============================================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend integration tests (6 services)
        env:
          JWT_SECRET: ci-test-secret-key-at-least-64-chars-long-for-hs512-algorithm-security
        run: |
          mvn verify \
            -pl api-gateway,core-service,commerce-service,payment-service,logistics-service,intelligence-service \
            -am \
            -Dsurefire.skip=true \
            -Djacoco.haltOnFailure=false \
            --no-transfer-progress

  # ============================================================
  # Job 2: Frontend tests + type check
  # ============================================================
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: integration-matrix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npm run typecheck

      - name: Run unit tests
        env:
          VITE_API_GATEWAY_URL: http://localhost:8080/api
          VITE_API_BASE_URL: http://localhost:8080/api
          VITE_WS_URL: http://localhost:8080/ws
        run: cd frontend && npm run test:run

  # ============================================================
  # Job 3: Frontend production Docker image build (catches
  # breakage in Dockerfile.production without deploying anywhere)
  # ============================================================
  frontend-docker-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f frontend/Dockerfile.production -t masova-frontend:ci frontend

      - name: Run container and verify it becomes healthy
        run: |
          docker run -d --name frontend-ci -p 8080:80 masova-frontend:ci
          for _ in $(seq 1 10); do
            status=$(docker inspect --format='{{.State.Health.Status}}' frontend-ci)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Container failed to become healthy" >&2
          docker logs frontend-ci
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f frontend-ci || true