# Conservative Dependabot — security-first, low PR volume.

version: 2

updates:
  # ── Maven (all 6 services + shared modules via root pom) ──────────────────
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # Wait a week before proposing a newly published version: bad releases are usually
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - java
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Spring Boot minor bumps need intentional upgrade windows
      - dependency-name: org.springframework.boot:spring-boot-dependencies
        update-types:
          - version-update:semver-major
      # Spring Boot 4 is a planned migration, not a dependency bump. The services pin Boot
      # through the spring-boot.version property, which the rule above does not match
      # (it let #232 through, and its backend tests failed). Hold every Boot artifact.
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - version-update:semver-major
      # springdoc 3 requires Spring Boot 4 (#230 and #233 failed OpenAPI validation on Boot 3.5).
      - dependency-name: "org.springdoc:*"
        update-types:
          - version-update:semver-major
      # Spring Cloud release trains move as "minor" versions but 2025.1+ needs Spring Boot 4
      - dependency-name: org.springframework.cloud:spring-cloud-dependencies
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # resilience4j 2.4.0 breaks commerce-service startup (RxJava3FallbackDecorator
      # not on classpath); held at 2.1.0 until that is fixed upstream or worked around.
      - dependency-name: "io.github.resilience4j:*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # ── Frontend (customer + staff web) ───────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # Wait a week before proposing a newly published version: bad releases are usually
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - frontend
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # msw 3 changes the handler API; the frontend and Pact consumer tests fail on it (#234).
      # Upgrade it on purpose together with the mocks.
      - dependency-name: msw
        update-types:
          - version-update:semver-major
      # jsdom 31 changes how inline styles read back, and the tabs, skeleton and avatar
      # style tests fail on it (#242). Upgrade it on purpose together with those tests.
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
  # ── GitHub Actions (CI, deploy, contract validation) ──────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    # Wait a week before proposing a newly published version: bad releases are usually
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci