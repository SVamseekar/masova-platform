spring:
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/masova_analytics_test
  rabbitmq:
    host: localhost
    port: 5672
    username: masova
    password: masova_secret
    # Listeners stay off by default. Every IT context here connects to the same RabbitMQ
    # container, and Spring caches contexts between test classes, so a cached context with
    # running listeners competes for the analytics queues and takes the messages that
    # AnalyticsConsumerIT's harness is waiting for. AnalyticsConsumerIT turns them back on.
    listener:
      simple:
        auto-startup: false
  cache:
    type: none

jwt:
  secret: test-secret-key-at-least-64-characters-long-for-hs512-algorithm-ok
  access-token-expiration: 900000
  refresh-token-expiration: 86400000

logging:
  level:
    com.MaSoVa: WARN
    org.springframework: WARN
    org.testcontainers: WARN
